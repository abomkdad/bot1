<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MAD Catalog Demo</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px;max-width:900px}
    input{width:100%;padding:10px;font-size:16px}
    button{padding:10px 14px;font-size:16px;margin-top:10px}
    pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row > *{flex:1}
  </style>
</head>
<body>
  <h2>MAD Catalog Demo (Sheet API)</h2>
  <p>This page loads products from your Apps Script API and searches by name/code.</p>

  <div class="row">
    <input id="q" placeholder="Try: W180 or creed or armani si" />
    <button id="btn">Search</button>
  </div>

  <pre id="out">Loading...</pre>

  <script type="module">
    import { loadCatalog, searchCatalog, formatOneProduct } from "./catalog.js";

    const out = document.getElementById("out");
    const qEl = document.getElementById("q");
    const btn = document.getElementById("btn");

    let catalog;
    try{
      catalog = await loadCatalog({ limit: 500 });
      out.textContent = "Catalog loaded: " + catalog.products.length + " products";
    }catch(e){
      out.textContent = "Failed: " + e.message;
    }

    btn.addEventListener("click", () => {
      if(!catalog) return;
      const q = qEl.value;
      const res = searchCatalog(catalog, q).slice(0, 10);
      if(res.length === 0){
        out.textContent = "No results";
        return;
      }
      out.textContent = res.map(p => formatOneProduct(p, "AR")).join("\n\n");
    });
  </script>
</body>
</html>
